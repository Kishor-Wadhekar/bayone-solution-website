<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BayOne | Visitors</title>


    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {
            background: #f6f7fb;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            color: #222;
        }


        .admin-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 18px 0;
        }


        .brand-title {
            color: #cc297a;
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }


        .brand-subtitle {
            color: #777;
            font-size: 13px;
            margin: 3px 0 0;
        }


        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }


        .page-description {
            color: #777;
            margin-bottom: 0;
        }


        .content-wrapper {
            padding: 30px 0 50px;
        }


        .stat-card {
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 22px;
            height: 100%;
        }


        .stat-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }


        .stat-value {
            font-size: 30px;
            font-weight: 700;
            color: #cc297a;
        }


        .table-card {
            background: #ffffff;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            overflow: hidden;
        }


        .table-toolbar {
            padding: 18px;
            border-bottom: 1px solid #e8e8e8;
        }


        .table-responsive {
            min-height: 300px;
        }


        .table {
            margin-bottom: 0;
            white-space: nowrap;
        }


        .table thead th {
            background: #f8f8fa;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            padding: 14px 16px;
        }


        .table tbody td {
            padding: 14px 16px;
            vertical-align: middle;
            font-size: 14px;
        }


        .table tbody tr:hover {
            background: #fafafa;
        }


        .btn-primary {
            background: #cc297a;
            border-color: #cc297a;
        }


        .btn-primary:hover,
        .btn-primary:focus {
            background: #b5226b;
            border-color: #b5226b;
        }


        .btn-outline-primary {
            color: #cc297a;
            border-color: #cc297a;
        }


        .btn-outline-primary:hover {
            background: #cc297a;
            border-color: #cc297a;
            color: #ffffff;
        }


        .visitor-badge {
            display: inline-block;
            background: #fce8f2;
            color: #cc297a;
            border-radius: 30px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
        }


        .empty-state {
            text-align: center;
            padding: 70px 20px;
            color: #777;
        }


        .empty-state-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }


        .loading-state {
            text-align: center;
            padding: 70px 20px;
            color: #777;
        }


        .action-buttons {
            display: flex;
            gap: 6px;
        }


        .footer {
            text-align: center;
            color: #999;
            font-size: 13px;
            padding: 20px 0;
        }


        @media (max-width: 767px) {

            .page-title {
                font-size: 24px;
            }


            .table-toolbar {
                padding: 14px;
            }


            .toolbar-actions {
                margin-top: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="admin-header">

        <div class="container-fluid px-4">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h1 class="brand-title">
                        BayOne
                    </h1>

                    <p class="brand-subtitle">
                        Visitor Management
                    </p>

                </div>


                <button
                    type="button"
                    class="btn btn-outline-primary"
                    id="refreshButton"
                >
                    Refresh
                </button>

            </div>

        </div>

    </header>



    <!-- ======================================================
         MAIN CONTENT
    ======================================================= -->

    <main class="content-wrapper">

        <div class="container-fluid px-4">


            <!-- PAGE TITLE -->

            <div class="mb-4">

                <h2 class="page-title">
                    Brochure Visitors
                </h2>

                <p class="page-description">
                    Manage visitors who submitted the BayOne brochure request form.
                </p>

            </div>



            <!-- ==================================================
                 STATISTICS
            =================================================== -->

            <div class="row g-3 mb-4">

                <div class="col-md-4">

                    <div class="stat-card">

                        <div class="stat-label">
                            Total Visitors
                        </div>

                        <div
                            class="stat-value"
                            id="totalVisitors"
                        >
                            0
                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="stat-card">

                        <div class="stat-label">
                            Records Displayed
                        </div>

                        <div
                            class="stat-value"
                            id="displayedVisitors"
                        >
                            0
                        </div>

                    </div>

                </div>


                <div class="col-md-4">

                    <div class="stat-card">

                        <div class="stat-label">
                            Last Updated
                        </div>

                        <div
                            class="stat-value"
                            id="lastUpdated"
                            style="font-size: 18px;"
                        >
                            -
                        </div>

                    </div>

                </div>

            </div>



            <!-- ==================================================
                 TABLE
            =================================================== -->

            <div class="table-card">


                <!-- TOOLBAR -->

                <div class="table-toolbar">

                    <div class="row align-items-center g-2">


                        <div class="col-lg-5">

                            <input
                                type="search"
                                class="form-control"
                                id="searchInput"
                                placeholder="Search name, email, company..."
                            >

                        </div>


                        <div class="col-lg-7">

                            <div
                                class="toolbar-actions d-flex justify-content-lg-end gap-2"
                            >

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="exportCsvButton"
                                >
                                    Export CSV
                                </button>


                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="exportJsonButton"
                                >
                                    Export JSON
                                </button>


                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    id="refreshButtonTop"
                                >
                                    Refresh
                                </button>

                            </div>

                        </div>

                    </div>

                </div>



                <!-- TABLE -->

                <div class="table-responsive">

                    <table class="table">

                        <thead>

                            <tr>

                                <th>
                                    #
                                </th>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Email
                                </th>

                                <th>
                                    Phone
                                </th>

                                <th>
                                    Company
                                </th>

                                <th>
                                    Designation
                                </th>

                                <th>
                                    Consent
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <tbody id="visitorTableBody">

                            <tr>

                                <td
                                    colspan="9"
                                    class="loading-state"
                                >

                                    Loading visitors...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>



                <!-- PAGINATION -->

                <div class="p-3 border-top">

                    <div class="d-flex justify-content-between align-items-center">

                        <div
                            class="text-muted small"
                            id="paginationInfo"
                        >
                            Showing 0 records
                        </div>


                        <div
                            class="btn-group"
                            role="group"
                        >

                            <button
                                type="button"
                                class="btn btn-outline-secondary btn-sm"
                                id="previousButton"
                            >
                                Previous
                            </button>


                            <button
                                type="button"
                                class="btn btn-outline-secondary btn-sm"
                                id="nextButton"
                            >
                                Next
                            </button>

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </main>



    <!-- ======================================================
         FOOTER
    ======================================================= -->

    <footer class="footer">

        BayOne Solutions &copy;
        <span id="currentYear"></span>

    </footer>



    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script src="./visitors.js"></script>

</body>

</html>
